name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on ${{ matrix.os }} with Zig ${{ matrix.zig_version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.zig_version == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
          - ubuntu-24.04-arm
        zig_version: ["0.15.2", "master"]
        include:
          - os: ubuntu-latest
            build_flags: "-Dtarget=x86_64-linux"
          - os: macos-15
            build_flags: ""
          - os: windows-latest
            build_flags: ""
          - os: ubuntu-24.04-arm
            build_flags: "-Dtarget=aarch64-linux"

    steps:
      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Pacific/Honolulu"
          timezoneMacos: "Pacific/Honolulu"
          timezoneWindows: "Hawaiian Standard Time"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libc6-dev clang

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Build project
        run: zig build ${{ matrix.build_flags }} -Doptimize=ReleaseSmall

      - name: Run tests
        run: zig build test --summary all

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: unixtime-${{ runner.os }}-${{ matrix.zig_version }}-${{ runner.arch }}
          path: |
            zig-out/bin/unixtime*
